site_name: Site Name
site_description: Site Description
site_author: Project Team
repo_url: https://github.com/k2works/claude-code-booster
repo_name: claude-code-booster

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - docs/mkdocs/assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js
  - docs/assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works
      name: GitHub Repository/claude-code-booster

plugins:
  - search

exclude_docs: |
  wiki

nav:
  - Home: index.md
  - 戦略:
      - 概要: strategy/index.md
      - インセプションデッキ: strategy/inception_deck.md
  - 要件:
      - 概要: requirements/index.md
      - ユーザーストーリー: requirements/user_stories.md
  - 開発:
      - 概要: development/index.md
      - リリース計画: development/release_plan.md
      - イテレーション 1 計画: development/iteration_plan-1.md
      - イテレーション 1 ふりかえり: development/retrospective-1.md
      - イテレーション 2 計画: development/iteration_plan-2.md
      - イテレーション 2 ふりかえり: development/retrospective-2.md
      - イテレーション 3 計画: development/iteration_plan-3.md
      - イテレーション 3 ふりかえり: development/retrospective-3.md
      - イテレーション 4 計画: development/iteration_plan-4.md
      - イテレーション 4 ふりかえり: development/retrospective-4.md
      - イテレーション 5 計画: development/iteration_plan-5.md
      - イテレーション 6 計画（MVP）: development/iteration_plan-6.md
  - 運用:
