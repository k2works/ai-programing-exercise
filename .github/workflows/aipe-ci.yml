name: aipe CI

on:
  push:
    branches:
      - main
      - 'minecraft/**'
    paths:
      - 'apps/aipe/**'
      - '.github/workflows/aipe-ci.yml'
  pull_request:
    paths:
      - 'apps/aipe/**'
      - '.github/workflows/aipe-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aipe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & JUnit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/aipe
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.head_ref != 'main' }}

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew
        # Windows でコミットされた gradlew の実行ビットが落ちていても CI が通るようにするための保険

      - name: Build & Unit Test
        run: ./gradlew --no-daemon build test

      - name: Acceptance Test (GameTest)
        run: ./gradlew --no-daemon runGameTestServer
        # NeoForge GameTest を実 Minecraft 環境で自動実行
        # 構造 NBT は src/generated/resources にコミット済みのため runData は不要

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/aipe/build/test-results/
            apps/aipe/run/
          retention-days: 7
